# 公司层（scope=company）分析配置
# 内化来源：C:/Users/12236/WorkBuddy/研究顾问方法论.md
#          + experts/alphapai-deep-research-team（基本面深度研究专家团）

version: "1.0"

# ── 触发与路由 ────────────────────────────────
scope_routing:
  industry:
    when: 标的是一个行业、环节或品种
    phases: phases/00 — phases/06
    default_form: longform
  company:
    when: 标的是一家具体公司（有证券代码）
    phases: phases/07-company-analysis.md
    default_form: company-report
  cross_rule: |
    需要横向比较多家公司时，先跑 industry 定行业结构，
    再逐个跑 company；不得直接罗列公司而不做行业拆解。

# ── 与公司业轨的接口 ──────────────────────────
industry_interface:
  reuse_when: 存在对应行业的 domain playbook
  reuse_items:
    - 那根杠杆
    - 跟踪信号表
    - 口径陷阱表
  reverse_check: 用公司实际数据反向校验行业结论
  when_missing: |
    用六维框架第 3、4 维做局部分析，
    并在报告中注明「行业结构未做完整拆解，本结论仅基于公司视角」

# ── 数据源优先级（公司层）────────────────────
data_sources:
  - 交易所披露原文（A股 cninfo.com.cn / 港股 hkexnews.hk / 美股 SEC EDGAR）
  - 公司 IR 站业绩公告 PDF 原文（非新闻稿）
  - 官方业绩说明会 / 电话会实录
  - 国家统计局、行业协会、第三方权威监测（须标机构名）
  - 券商研报与媒体报道：仅交叉印证，不得作为事实来源

# ── 12 项财务必查清单 ───────────────────────
financial_checklist:
  - 收入分部表
  - 毛利与分部毛利率
  - 分部经营利润 / 营业利润率
  - 经营现金流 vs 净利润（OCF/净利润，连续 3 年）
  - 资本开支 + 折旧摊销（FCF = OCF − CapEx）
  - ROE（杜邦三因子）与 ROIC（NOPAT / 投入资本）
  - 合同负债 / 递延收入
  - 应收账款周转天数 + 账龄结构
  - 存货（含跌价准备）
  - 商誉与无形资产 + 历年减值史
  - 关联交易
  - 回购、派息、股权激励
  core_required: [收入分部表, 毛利与分部毛利率, 经营现金流, 资本开支, ROE_or_ROIC]
  rule: 核心 5 项缺失 ≥2 项 → 判定不适合产出报告，明确告知缺什么
  missing_note: 缺项必须写明「口径缺失 + 原因」，不得估算或类比填补

# ── 六维分析框架 ────────────────────────────
six_dimensions:
  - 商业模式
  - 业务结构与增长驱动
  - 护城河与竞争地位
  - 行业空间与前景
  - 风险与跟踪信号
  - 估值（仅隐含预期反推）

# ── 估值：只反推，不定价 ────────────────────
valuation:
  allowed:
    - 当前市值隐含的未来 N 年 FCF 复合增速
    - 历史估值分位（PE/PB 近 5 年位置）
    - ROIC 与资本成本差值是否支持当前溢价
    - FCF 收益率与无风险利率比较
  forbidden:
    - 目标价 / 合理市值区间 / 上涨空间
    - 「低估 / 该买」等定价结论
  allowed_phrase: 可说「隐含预期偏高/偏低」（事实描述）
  forbidden_phrase: 不可说「应该值 X 元」

# ── 11 节报告结构 ──────────────────────────
report_sections:
  - 核心洞察（1—3 条）
  - 标的卡片
  - 商业模式
  - 业务结构与增长驱动
  - 护城河与竞争地位
  - 行业空间与所处阶段
  - 财务质量
  - 主要风险
  - 尚待验证的假设（≥5 条）
  - 后续跟踪信号表（≥8 行）
  - 数据缺口与需补充的材料
  rule: 缺任一节即判定失败

# ── 验收标准（9 条，缺一即失败）──────────────
acceptance:
  - 产出独立 .md 文件，落在指定产出目录
  - 11 个小节齐全，无空缺
  - 关键数字 ≥20 处带「来源 + 期间 + 口径」
  - 12 项财务清单覆盖核心 5 项，未获取项写明「口径缺失 + 原因」
  - 尚待验证假设 ≥5 条
  - 跟踪信号表 ≥8 行且含触发阈值
  - 数据缺口章节非空
  - 全篇无硬边界排除项（自检一遍）
  - 正文 ≥3000 字

# ── 不适用于公司层范围的内容 ────────────────
out_of_scope:
  - 股票池筛选与「该买哪只」的比较推荐
  - 短周期业绩预测
  - 事件驱动博弈分析
  - 结构化行情与高频数据（分钟/盘中实时）
  - SQL 查询与物理数据库访问
  - 一级市场数据

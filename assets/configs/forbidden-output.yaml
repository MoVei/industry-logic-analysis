# 禁用输出与措辞黑名单
# Phase 4 形式校验、Phase 5 措辞终检共用。
# 终检要求：全量扫描段落 + 表格单元格，计数必须为 0，抽查不算。

version: "1.0"

# ── 第一优先级：硬性内容边界（不可关闭）─────────────────
hard_boundary:
  never_output:
    - 目标价
    - 价格涨跌预测
    - 买卖时点 / 择时
    - 仓位建议
    - 个股推荐与标的筛选
    - 市场情绪分析
    - 资金面分析
    - 技术分析
  allowed:
    - 估值只做「当前价格隐含了什么预期」的反推
    - 期货/远期价格用于描述「市场已给定什么价」，须附「预期 ≠ 事实」提醒
  overridable: false

# ── 第二层：模糊词黑名单 ──────────────────────────────
vague_words:
  - 尽量
  - 适当
  - 可以考虑
  - 建议关注
  - 大概率
  - 有望
  - 可能会
  - 在一定程度上
  - 某种意义上
  - 应该会
  action: 替换为具体标准，或直接删除

# ── 第三层：自谦 / 粉饰 / 让步结构 ───────────────────
# 规则：一律删除，禁止替换为委婉说法
self_deprecation:
  delete_only:
    - 有待完善
    - 仍有提升空间
    - 在后续版本中改进
    - 受限于水平
    - 难免存在疏漏
    - 仅供参考，不构成投资建议（冗余免责，本 Skill 已不产出建议）
  concession_structures:
    - "取舍"
    - "折中"
    - "代价"
    - "而非完全自研"
    - "对…要求较高"
    - "实现简单"
    - "响应可接受"
    - "样本量有限"
    - "若后续…可改为"
  note: |
    正常的技术选择不应描述为退让。
    处理方式：删除让步结构，保留正向陈述。

# ── 白名单：不得误删 ────────────────────────────────
whitelist:
  - 风险            # 业务术语
  - 而非            # 中性技术对比
  - 原始            # 专业术语，如「原始数据」

# ── 第四层：无效表达 ────────────────────────────────
invalid_expressions:
  - 综上所述
  - 具有重要的参考价值
  - 需要指出的是
  - 众所周知
  - 由此可见
  - 随着时代的发展

# ── 第五层：审校反馈禁令 ────────────────────────────
review_feedback_prohibited:
  - 整体不错，细节可再打磨
  - 逻辑清晰，继续加油
  - 建议再丰富一下
  rule: 每条反馈必须指明位置 + 问题性质 + 具体怎么改；挑不出 3 个具体问题视为审校未完成

# ── 第六层：写作红线 ────────────────────────────────
writing_redlines:
  - 禁止百科词条式概述
  - 禁止罗列概念
  - 禁止以提问句或宏大叙事开场
  - 禁止把估算值写入正文
  - 禁止转录既有产出作为 SOP 数据来源
  - 单文件不得超过 500 行
